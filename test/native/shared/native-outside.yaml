appId: com.reactnativeoutside.smoke
---
- launchApp:
    clearState: true
- assertVisible: "CONTAINS_SMOKE_STATIC_PASS"
- tapOn:
    id: contains-event
- assertVisible: "EVENT_SMOKE_RECEIVED"
- assertVisible: "CONTAINS_SMOKE_EVENT_INSIDE"
- tapOn:
    id: contains-outside-event
- assertVisible: "CONTAINS_SMOKE_EVENT_OUTSIDE"
- tapOn:
    id: contains-complete
- assertVisible: "ACTIVE_SMOKE_INACTIVE"
- tapOn:
    id: active-toggle
- assertVisible: "ACTIVE_SMOKE_ACTIVE"
- tapOn:
    id: active-inside
- assertVisible: "ACTIVE_SMOKE_ACTIVE"
- assertVisible: "EVENT_SMOKE_RECEIVED"
- tapOn:
    id: outside
- assertVisible: "ACTIVE_SMOKE_INACTIVE"
- assertVisible: "BOUNDARY_SMOKE_INACTIVE"
- tapOn:
    id: boundary-toggle
- assertVisible: "BOUNDARY_SMOKE_ACTIVE"
- tapOn:
    id: boundary-inside
- assertVisible: "BOUNDARY_SMOKE_ACTIVE"
- tapOn:
    id: registered-portal
- assertVisible: "BOUNDARY_SMOKE_ACTIVE"
- assertVisible: "BOUNDARY_REGISTRY_REGISTERED"
- tapOn:
    id: boundary-cleanup
- assertVisible: "BOUNDARY_REGISTRY_CLEAN"
- tapOn:
    id: unrelated-portal
- assertVisible: "BOUNDARY_SMOKE_INACTIVE"
- tapOn:
    id: boundary-toggle
- assertVisible: "BOUNDARY_SMOKE_ACTIVE"
- tapOn:
    id: outside
- assertVisible: "BOUNDARY_SMOKE_INACTIVE"
