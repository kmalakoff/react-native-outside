name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      native_profile:
        description: Native profile; minimum and all include exploratory legacy testing
        type: choice
        default: current
        options: [current, minimum, all]
      native_candidate_manifest:
        description: Optional full native candidate manifest JSON for a coordinated canonical manual run
        type: string
        default: ''
jobs:
  candidate-packages:
    name: Build reviewed sibling packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/checkout@v7
        with:
          repository: kmalakoff/react-native-contains
          ref: 39990aeb9e4457bbc87db275f30b306308b63eca
          path: .tmp/candidates/react-native-contains
      - name: Pack react-native-contains
        working-directory: .tmp/candidates/react-native-contains
        run: |
          npm ci
          npm run build
          mkdir -p ../../packages
          npm pack --ignore-scripts --pack-destination ../../packages
      - uses: actions/checkout@v7
        with:
          repository: kmalakoff/react-native-event
          ref: 19be7f009f1220318d1a1f4f01eb20c40e36f071
          path: .tmp/candidates/react-native-event
      - name: Pack react-native-event
        working-directory: .tmp/candidates/react-native-event
        run: |
          npm ci
          npm run build
          mkdir -p ../../packages
          npm pack --ignore-scripts --pack-destination ../../packages
      - uses: actions/checkout@v7
        with:
          repository: kmalakoff/react-ref-boundary
          ref: e3b18914c5bca416186dc52a714fc865ce264e2b
          path: .tmp/candidates/react-ref-boundary
      - name: Pack react-ref-boundary
        working-directory: .tmp/candidates/react-ref-boundary
        run: |
          npm ci
          npm run build
          mkdir -p ../../packages
          npm pack --ignore-scripts --pack-destination ../../packages
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-sibling-packages
          path: .tmp/packages/*.tgz
          if-no-files-found: error
          include-hidden-files: true
  test:
    needs: candidate-packages
    name: Node.js ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: git config --global user.name "Github Actions"
      - run: git config --global user.email "actions@users.noreply.github.com"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-sibling-packages
          path: .tmp/packages
      - name: Install reviewed siblings
        run: npm install --ignore-scripts --no-save --package-lock=false ./.tmp/packages/react-native-contains-1.0.16.tgz ./.tmp/packages/react-native-event-1.0.15.tgz ./.tmp/packages/react-ref-boundary-1.0.14.tgz
      - run: npx -y playwright install --with-deps chromium
      - run: npm run prepublishOnly
      - run: npm run test
      - run: npm run test:engines
  native-compatibility:
    name: Native compatibility
    uses: ./.github/workflows/native.yml
    with:
      profile: ${{ inputs.native_profile || 'current' }}
      candidate_package: react-native-outside
      candidate_repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      candidate_manifest: ${{ inputs.native_candidate_manifest }}
      fixture_repository: ${{ github.repository }}
      fixture_sha: ${{ github.sha }}
    permissions:
      contents: read
